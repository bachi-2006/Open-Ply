services:
  - type: web
    name: openply-api
    env: node
    region: oregon
    plan: free
    rootDir: site
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: GEMINI_MODEL
        value: google/gemini-3.8-flash
      - key: ALLOWED_ORIGINS
        value: https://openply-app-2026.web.app,https://openply-app-2026.firebaseapp.com,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false